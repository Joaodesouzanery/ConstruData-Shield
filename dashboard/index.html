<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstruData Shield - Security Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2A428C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ConstruData Shield - AI-powered security testing with 13 Claude Opus agents">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">
        <i class="fas fa-shield-halved"></i>
      </div>
      <div class="logo-text">
        <span class="logo-label">Security</span>
        <span class="logo-team">ConstruData Shield</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <span class="nav-group-label">Main Menu</span>
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="#scans" class="nav-item" data-page="scans">
          <i class="fas fa-crosshairs"></i>
          <span>Scans</span>
        </a>
        <a href="#vulnerabilities" class="nav-item" data-page="vulnerabilities">
          <i class="fas fa-bug"></i>
          <span>Vulnerabilities</span>
        </a>
        <a href="#reports" class="nav-item" data-page="reports">
          <i class="fas fa-file-shield"></i>
          <span>Reports</span>
        </a>
        <a href="#analytics" class="nav-item" data-page="analytics">
          <i class="fas fa-chart-line"></i>
          <span>Analytics</span>
        </a>
        <a href="#alerts" class="nav-item" data-page="alerts">
          <i class="fas fa-bell"></i>
          <span>Alerts</span>
          <span class="nav-badge">3</span>
        </a>
        <a href="#tutorial" class="nav-item" data-page="tutorial">
          <i class="fas fa-graduation-cap"></i>
          <span>Tutorial</span>
          <span class="nav-badge" style="background:var(--yellow);color:var(--navy-darkest)">NEW</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Targets</span>
        <a href="#applications" class="nav-item" data-page="applications">
          <i class="fas fa-globe"></i>
          <span>Applications</span>
        </a>
        <a href="#endpoints" class="nav-item" data-page="endpoints">
          <i class="fas fa-server"></i>
          <span>API Endpoints</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Settings</span>
        <a href="#settings" class="nav-item" data-page="settings">
          <i class="fas fa-gear"></i>
          <span>System Settings</span>
        </a>
        <a href="#help" class="nav-item" data-page="help">
          <i class="fas fa-circle-question"></i>
          <span>Help Center</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Sidebar overlay for mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
      <div class="breadcrumb" id="breadcrumb">
        <span>Dashboard</span>
        <i class="fas fa-chevron-right"></i>
        <span class="breadcrumb-active">Overview</span>
      </div>
      <div class="top-bar-right">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search..." id="globalSearch">
        </div>
        <div class="period-selector">
          <span>Daily</span>
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
    </header>

    <!-- Page container (SPA routing) -->
    <div id="page-container"></div>
  </main>

  <!-- Page Templates -->

  <!-- DASHBOARD PAGE -->
  <template id="tpl-dashboard">
    <section class="welcome-section">
      <h1>Welcome back, <span class="highlight">Operator</span></h1>
    </section>
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-header"><span class="stat-label">TOTAL SCANS</span></div>
        <div class="stat-body">
          <div class="stat-info">
            <span class="stat-value" id="stat-scans">0</span>
            <div class="stat-bars"><span class="bar" style="height:40%"></span><span class="bar" style="height:60%"></span><span class="bar" style="height:80%"></span><span class="bar" style="height:55%"></span><span class="bar" style="height:90%"></span></div>
          </div>
          <div class="stat-footer"><i class="fas fa-circle-info"></i><span class="stat-change positive">+12.4% last month</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-header"><span class="stat-label">VULNERABILITIES FOUND</span></div>
        <div class="stat-body">
          <div class="stat-info">
            <span class="stat-value" id="stat-vulns">0</span>
            <span class="stat-sub">Findings</span>
            <div class="stat-bars"><span class="bar" style="height:70%"></span><span class="bar" style="height:45%"></span><span class="bar" style="height:85%"></span><span class="bar" style="height:60%"></span><span class="bar" style="height:75%"></span></div>
          </div>
          <div class="stat-footer"><i class="fas fa-circle-info"></i><span class="stat-change positive">+8.2% last month</span></div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-header"><span class="stat-label">CRITICAL ISSUES</span></div>
        <div class="stat-body">
          <div class="stat-info">
            <span class="stat-value" id="stat-critical">0</span>
            <span class="stat-sub">Active</span>
            <div class="stat-bars"><span class="bar bar-critical" style="height:90%"></span><span class="bar bar-critical" style="height:65%"></span><span class="bar bar-critical" style="height:50%"></span><span class="bar bar-critical" style="height:80%"></span><span class="bar bar-critical" style="height:70%"></span></div>
          </div>
          <div class="stat-footer"><i class="fas fa-circle-info"></i><span class="stat-change negative">-3.1% last month</span></div>
        </div>
      </div>
    </section>
    <section class="charts-row">
      <div class="chart-card chart-main">
        <div class="chart-header">
          <div class="chart-title"><span>VULNERABILITY TREND</span> <i class="fas fa-circle-info"></i></div>
          <button class="chart-menu"><i class="fas fa-ellipsis"></i></button>
        </div>
        <div class="chart-sub-header">
          <div class="chart-total"><span class="chart-total-label">Total Found:</span> <span class="chart-total-value">3,891</span></div>
          <div class="chart-legend"><span class="legend-item"><span class="legend-dot new"></span> NEW</span><span class="legend-item"><span class="legend-dot resolved"></span> RESOLVED</span></div>
          <div class="chart-period-tabs"><button>Weekly</button><button class="active">Monthly</button><button>Yearly</button></div>
        </div>
        <div class="chart-container"><canvas id="vulnTrendChart"></canvas></div>
      </div>
      <div class="chart-card chart-side">
        <div class="chart-header"><div class="chart-title"><span>SEVERITY</span></div></div>
        <div class="severity-stats">
          <div class="severity-total"><span class="severity-total-label">Total Issues</span><span class="severity-total-value">3,891</span></div>
          <button class="btn-outline"><i class="fas fa-wand-magic-sparkles"></i> AI Summary</button>
        </div>
        <div class="chart-container chart-container-sm"><canvas id="severityChart"></canvas></div>
        <div class="severity-legend">
          <div class="severity-item"><span class="severity-dot critical"></span><span>Critical</span><span class="severity-count">47</span></div>
          <div class="severity-item"><span class="severity-dot high"></span><span>High</span><span class="severity-count">189</span></div>
          <div class="severity-item"><span class="severity-dot medium"></span><span>Medium</span><span class="severity-count">1,204</span></div>
          <div class="severity-item"><span class="severity-dot low"></span><span>Low</span><span class="severity-count">2,451</span></div>
        </div>
      </div>
    </section>
    <section class="table-section">
      <div class="table-header">
        <div class="table-title"><span>RECENT SCANS</span> <i class="fas fa-circle-info"></i></div>
        <button class="btn-primary btn-sm" onclick="window.location.hash='scans'"><i class="fas fa-plus"></i> New Scan</button>
      </div>
      <div class="table-wrapper" id="dashboard-scans-table"></div>
    </section>
  </template>

  <!-- SCANS PAGE -->
  <template id="tpl-scans">
    <section class="page-header-row">
      <div>
        <h1 class="page-title">Security Scans</h1>
        <p class="page-subtitle">Launch and monitor automated penetration tests</p>
      </div>
      <button class="btn-primary" id="btn-new-scan"><i class="fas fa-plus"></i> New Scan</button>
    </section>

    <!-- New Scan Form (hidden by default) -->
    <section class="form-card" id="new-scan-form" style="display:none">
      <div class="form-card-header">
        <h2><i class="fas fa-rocket"></i> Launch New Scan</h2>
        <button class="btn-ghost" id="btn-close-form"><i class="fas fa-times"></i></button>
      </div>

      <!-- Safety Warning -->
      <div class="safety-banner">
        <i class="fas fa-exclamation-triangle"></i>
        <div class="safety-banner-text">
          <strong>Authorized Testing Only.</strong> Only scan applications that you own or have explicit written permission to test.
          Unauthorized access is a crime (Art. 154-A CP, CFAA, Computer Misuse Act). Always use a <strong>staging environment</strong> instead of production.
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Target URL <span class="required">*</span></label>
          <input type="url" id="scan-url" placeholder="https://app.construdata.com" class="form-input">
          <span class="form-hint">The URL of the application to test</span>
        </div>
        <div class="form-group">
          <label>Repository Name <span class="required">*</span></label>
          <input type="text" id="scan-repo" placeholder="my-app" class="form-input">
          <span class="form-hint">Folder name under ./repos/</span>
        </div>
        <div class="form-group">
          <label>Scan Type</label>
          <select id="scan-type" class="form-input">
            <option value="full">Full Pipeline (5 phases, ~1h)</option>
            <option value="recon">Recon Only (~15m)</option>
            <option value="vuln">Vulnerability Analysis Only (~30m)</option>
            <option value="auth">Auth Focus (~20m)</option>
            <option value="api">API Only (~45m)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Workspace Name</label>
          <input type="text" id="scan-workspace" placeholder="audit-q1-2026 (optional)" class="form-input">
          <span class="form-hint">Named workspace for resume capability</span>
        </div>
      </div>

      <!-- Auth config (collapsible) -->
      <details class="form-details">
        <summary><i class="fas fa-key"></i> Authentication Configuration</summary>
        <div class="form-grid">
          <div class="form-group">
            <label>Login Type</label>
            <select id="auth-type" class="form-input">
              <option value="">No authentication</option>
              <option value="form">Form Login</option>
              <option value="api">API Key</option>
              <option value="basic">Basic Auth</option>
              <option value="sso">SSO/OAuth</option>
            </select>
          </div>
          <div class="form-group">
            <label>Login URL</label>
            <input type="url" id="auth-url" placeholder="https://app.construdata.com/login" class="form-input">
          </div>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="auth-user" placeholder="test@example.com" class="form-input">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-pass" placeholder="test-password" class="form-input">
          </div>
        </div>
      </details>

      <!-- Rules config (collapsible) -->
      <details class="form-details">
        <summary><i class="fas fa-filter"></i> Scope Rules</summary>
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Paths to Avoid (one per line)</label>
            <textarea id="rules-avoid" class="form-input form-textarea" placeholder="/api/payments&#10;/logout&#10;/admin/delete"></textarea>
          </div>
          <div class="form-group full-width">
            <label>Focus Areas (one per line)</label>
            <textarea id="rules-focus" class="form-input form-textarea" placeholder="/api&#10;/admin&#10;/auth"></textarea>
          </div>
        </div>
      </details>

      <div class="form-actions">
        <button class="btn-ghost" id="btn-cancel-scan">Cancel</button>
        <button class="btn-primary" id="btn-launch-scan"><i class="fas fa-rocket"></i> Launch Scan</button>
      </div>

      <!-- CLI command preview (hidden - scans run directly from dashboard) -->
      <div class="cli-preview" id="cli-preview" style="display:none">
        <div class="cli-preview-header"><i class="fas fa-terminal"></i> CLI Command</div>
        <code id="cli-command">./shield start URL=https://... REPO=...</code>
      </div>
    </section>

    <!-- Scan History -->
    <section class="table-section">
      <div class="table-header">
        <div class="table-title"><span>SCAN HISTORY</span> <i class="fas fa-circle-info"></i></div>
        <div class="table-search"><i class="fas fa-search"></i><input type="text" placeholder="Search scans..." id="scan-search"></div>
      </div>
      <div class="table-wrapper" id="scans-table"></div>
    </section>
  </template>

  <!-- VULNERABILITIES PAGE -->
  <template id="tpl-vulnerabilities">
    <section class="page-header-row">
      <div>
        <h1 class="page-title">Vulnerabilities</h1>
        <p class="page-subtitle">All findings across scans, sorted by severity</p>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All <span class="filter-count">3,891</span></button>
        <button class="filter-btn critical" data-filter="critical">Critical <span class="filter-count">47</span></button>
        <button class="filter-btn high" data-filter="high">High <span class="filter-count">189</span></button>
        <button class="filter-btn medium" data-filter="medium">Medium <span class="filter-count">1,204</span></button>
        <button class="filter-btn low" data-filter="low">Low <span class="filter-count">2,451</span></button>
      </div>
    </section>
    <section class="vuln-list" id="vuln-list"></section>
  </template>

  <!-- REPORTS PAGE -->
  <template id="tpl-reports">
    <section class="page-header-row">
      <div>
        <h1 class="page-title">Security Reports</h1>
        <p class="page-subtitle">Executive reports generated after each scan</p>
      </div>
    </section>
    <section class="reports-grid" id="reports-grid"></section>
  </template>

  <!-- GENERIC PAGE (for unbuilt sections) -->
  <template id="tpl-generic">
    <section class="empty-state">
      <div class="empty-state-icon"><i class="fas fa-hard-hat"></i></div>
      <h2 class="empty-state-title" id="generic-title">Coming Soon</h2>
      <p class="empty-state-text">This section is under construction. Check back soon!</p>
    </section>
  </template>

  <!-- HELP PAGE -->
  <template id="tpl-help">
    <section class="page-header-row">
      <div>
        <h1 class="page-title">Help Center</h1>
        <p class="page-subtitle">How to use ConstruData Shield</p>
      </div>
    </section>
    <section class="help-grid">
      <div class="help-card">
        <div class="help-card-icon"><i class="fas fa-play-circle"></i></div>
        <h3>Getting Started</h3>
        <ol class="help-steps">
          <li><strong>Clone this repo</strong> on a server with Docker</li>
          <li>Add your <code>ANTHROPIC_API_KEY</code> to <code>.env</code></li>
          <li>Place your target app's source code in <code>./repos/your-app/</code></li>
          <li>Go to <strong>Scans</strong> and click <strong>New Scan</strong></li>
          <li>Run the generated CLI command on your server</li>
        </ol>
      </div>
      <div class="help-card">
        <div class="help-card-icon"><i class="fas fa-terminal"></i></div>
        <h3>CLI Quick Reference</h3>
        <div class="help-cli">
          <div class="help-cli-row"><code>./shield start URL=... REPO=...</code><span>Start a scan</span></div>
          <div class="help-cli-row"><code>./shield status ID=...</code><span>View progress</span></div>
          <div class="help-cli-row"><code>./shield logs ID=...</code><span>Tail live logs</span></div>
          <div class="help-cli-row"><code>./shield workspaces</code><span>List all scans</span></div>
          <div class="help-cli-row"><code>./shield stop</code><span>Stop containers</span></div>
        </div>
      </div>
      <div class="help-card">
        <div class="help-card-icon"><i class="fas fa-shield-halved"></i></div>
        <h3>What Gets Tested</h3>
        <div class="help-categories">
          <span class="help-tag"><i class="fas fa-database"></i> SQL/NoSQL Injection</span>
          <span class="help-tag"><i class="fas fa-code"></i> XSS (Reflected/Stored/DOM)</span>
          <span class="help-tag"><i class="fas fa-key"></i> Auth Bypass & JWT</span>
          <span class="help-tag"><i class="fas fa-globe"></i> SSRF</span>
          <span class="help-tag"><i class="fas fa-user-lock"></i> IDOR & AuthZ</span>
          <span class="help-tag"><i class="fas fa-terminal"></i> Command Injection</span>
          <span class="help-tag"><i class="fas fa-file-code"></i> Template Injection</span>
          <span class="help-tag"><i class="fas fa-unlock"></i> Privilege Escalation</span>
        </div>
      </div>
      <div class="help-card">
        <div class="help-card-icon"><i class="fas fa-diagram-project"></i></div>
        <h3>Pipeline Phases</h3>
        <div class="help-pipeline">
          <div class="pipeline-phase"><span class="phase-num">1</span><div><strong>Pre-Recon</strong><br>Source code analysis (Claude Opus)</div></div>
          <div class="pipeline-phase"><span class="phase-num">2</span><div><strong>Recon</strong><br>Live app exploration (Playwright)</div></div>
          <div class="pipeline-phase"><span class="phase-num">3</span><div><strong>Vuln Analysis</strong><br>5 parallel agents hunt vulnerabilities</div></div>
          <div class="pipeline-phase"><span class="phase-num">4</span><div><strong>Exploitation</strong><br>5 agents attempt real exploits</div></div>
          <div class="pipeline-phase"><span class="phase-num">5</span><div><strong>Report</strong><br>Executive security assessment</div></div>
        </div>
      </div>
    </section>
  </template>

  <!-- TUTORIAL PAGE -->
  <template id="tpl-tutorial">
    <section class="page-header-row">
      <div>
        <h1 class="page-title">Tutorial Interativo</h1>
        <p class="page-subtitle">Aprenda a usar o ConstruData Shield passo a passo</p>
      </div>
      <div class="tutorial-progress-bar">
        <div class="tutorial-progress-fill" id="tutorial-progress-fill"></div>
        <span class="tutorial-progress-text" id="tutorial-progress-text">0 / 6</span>
      </div>
    </section>

    <div class="tutorial-container" id="tutorial-container">
      <!-- Step 1 -->
      <div class="tutorial-step" data-step="1">
        <div class="tutorial-step-header">
          <div class="tutorial-step-num">1</div>
          <div>
            <h3>O que e o ConstruData Shield?</h3>
            <p>Entenda como a plataforma funciona antes de comecar</p>
          </div>
          <span class="tutorial-step-status" id="step-status-1"><i class="fas fa-circle"></i></span>
        </div>
        <div class="tutorial-step-body">
          <div class="tutorial-info-grid">
            <div class="tutorial-info-card">
              <div class="tutorial-info-icon"><i class="fas fa-robot"></i></div>
              <h4>13 Agentes de IA</h4>
              <p>Claude Opus analisa codigo-fonte e testa a aplicacao com 13 agentes especializados em paralelo</p>
            </div>
            <div class="tutorial-info-card">
              <div class="tutorial-info-icon"><i class="fas fa-docker"></i></div>
              <h4>Docker + Temporal</h4>
              <p>Roda isolado em containers Docker, orquestrado pelo Temporal para resiliencia e resumabilidade</p>
            </div>
            <div class="tutorial-info-card">
              <div class="tutorial-info-icon"><i class="fas fa-file-shield"></i></div>
              <h4>Relatorio Executivo</h4>
              <p>Gera relatorio completo com provas, severidade CVSS, e recomendacoes de correcao</p>
            </div>
          </div>
          <div class="tutorial-pipeline-visual">
            <div class="pipeline-stage"><span class="pipeline-icon"><i class="fas fa-magnifying-glass-chart"></i></span><span>Pre-Recon</span><span class="pipeline-desc">Analise de codigo</span></div>
            <div class="pipeline-arrow"><i class="fas fa-arrow-right"></i></div>
            <div class="pipeline-stage"><span class="pipeline-icon"><i class="fas fa-satellite-dish"></i></span><span>Recon</span><span class="pipeline-desc">Mapeamento web</span></div>
            <div class="pipeline-arrow"><i class="fas fa-arrow-right"></i></div>
            <div class="pipeline-stage"><span class="pipeline-icon"><i class="fas fa-bug"></i></span><span>Vuln Analysis</span><span class="pipeline-desc">5 agentes</span></div>
            <div class="pipeline-arrow"><i class="fas fa-arrow-right"></i></div>
            <div class="pipeline-stage"><span class="pipeline-icon"><i class="fas fa-skull-crossbones"></i></span><span>Exploitation</span><span class="pipeline-desc">5 agentes</span></div>
            <div class="pipeline-arrow"><i class="fas fa-arrow-right"></i></div>
            <div class="pipeline-stage"><span class="pipeline-icon"><i class="fas fa-clipboard-check"></i></span><span>Report</span><span class="pipeline-desc">Avaliacao final</span></div>
          </div>
          <button class="btn-primary tutorial-next-btn" data-next="2"><i class="fas fa-check"></i> Entendi, proximo passo</button>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="tutorial-step locked" data-step="2">
        <div class="tutorial-step-header">
          <div class="tutorial-step-num">2</div>
          <div>
            <h3>Pre-requisitos</h3>
            <p>O que voce precisa ter configurado</p>
          </div>
          <span class="tutorial-step-status" id="step-status-2"><i class="fas fa-lock"></i></span>
        </div>
        <div class="tutorial-step-body">
          <div class="tutorial-checklist">
            <label class="tutorial-check-item"><input type="checkbox" class="tutorial-checkbox" data-req="docker"><span class="tutorial-check-label"><i class="fab fa-docker"></i> Docker + Docker Compose instalados</span><code>docker --version && docker compose version</code></label>
